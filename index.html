<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 출근룩</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="출근룩">
<style>
  :root { --bg:#fff; --text:#111; --sub:#8a8a8a; --line:#e9e9e9; --ink:#111; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased; letter-spacing:-0.01em; }
  .wrap { max-width:480px; margin:0 auto; padding:0 20px 56px; }
  button, select { font-family:inherit; color:inherit; }

  /* 상단 바 */
  .top { display:flex; justify-content:space-between; align-items:baseline; padding:20px 0 14px; border-bottom:1px solid var(--ink); }
  .brand { font-size:13px; font-weight:800; letter-spacing:0.14em; }
  .date { font-size:12px; color:var(--sub); }

  /* 날씨 */
  .hero { padding:28px 0 22px; }
  .hero .eyebrow { font-size:11px; letter-spacing:0.14em; color:var(--sub); font-weight:600; }
  .hero .temp { font-size:96px; line-height:1; font-weight:200; letter-spacing:-0.06em; margin:6px 0 10px -4px; }
  .hero .desc { font-size:13px; color:#555; line-height:1.6; }
  #wIcon { display:none; }

  /* 설정 줄 */
  .bar { display:flex; align-items:center; gap:18px; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tabs { display:flex; gap:16px; }
  .tabs button { background:none; border:none; padding:2px 0; font-size:13px; font-weight:700; letter-spacing:0.08em; color:#bbb; cursor:pointer; border-bottom:2px solid transparent; }
  .tabs button.on { color:var(--ink); border-bottom-color:var(--ink); }
  .bar .sp { flex:1; }
  select { appearance:none; -webkit-appearance:none; background:none; border:none; font-size:13px; font-weight:500; padding:2px 14px 2px 0; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,#111 50%),linear-gradient(135deg,#111 50%,transparent 50%);
    background-position:calc(100% - 6px) 55%, calc(100% - 2px) 55%; background-size:4px 4px; background-repeat:no-repeat; }
  .iconbtn { background:none; border:none; font-size:13px; font-weight:500; cursor:pointer; padding:2px 0; text-decoration:underline; text-underline-offset:3px; }
  .meta { font-size:11px; color:var(--sub); padding:10px 0 0; min-height:22px; }
  details.test { margin-top:6px; }
  details.test summary { font-size:11px; color:var(--sub); cursor:pointer; }
  details.test label { display:block; font-size:12px; color:var(--sub); margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#111; }

  /* 코디 */
  #outfit { padding:34px 0 8px; }
  .headline { font-size:24px; line-height:1.3; font-weight:800; margin:0 0 6px; letter-spacing:-0.03em; }
  .tip { color:#666; font-size:14px; margin:0 0 26px; line-height:1.5; }
  .item { display:flex; gap:16px; padding:18px 0; border-top:1px solid var(--line); }
  .item:last-of-type { border-bottom:1px solid var(--line); }
  .item .no { font-size:11px; font-weight:600; color:var(--sub); width:18px; padding-top:4px; letter-spacing:0.04em; }
  .item .body { flex:1; }
  .item .part { font-size:11px; color:var(--sub); letter-spacing:0.1em; margin-bottom:4px; }
  .item .name { font-size:18px; font-weight:600; line-height:1.35; letter-spacing:-0.02em; display:flex; align-items:center; gap:8px; }
  .sw { width:12px; height:12px; border-radius:50%; border:1px solid rgba(0,0,0,.18); flex:none; }
  .links { margin-top:10px; display:flex; gap:16px; }
  .links a { font-size:12px; color:var(--ink); text-decoration:underline; text-underline-offset:3px; text-decoration-color:#bbb; }
  .links a:active { text-decoration-color:var(--ink); }

  /* 피드백 / 버튼 */
  .fb { display:flex; gap:8px; margin-top:22px; }
  .fb button { flex:1; padding:13px 0; border-radius:2px; border:1px solid var(--ink); background:#fff; font-size:13px; font-weight:600; cursor:pointer; }
  .fb button.on { background:var(--ink); color:#fff; }
  .fbmsg { font-size:12px; color:#555; margin:12px 0 0; }
  #tip2 { font-size:12px; color:#555; background:#f6f6f6; padding:12px 14px; margin-top:18px; line-height:1.5; }
  #tip2:empty { display:none; }
  .btn { width:100%; padding:17px; border-radius:2px; border:none; background:var(--ink); color:#fff; font-size:14px; font-weight:700; letter-spacing:0.02em; cursor:pointer; margin-top:18px; }
  .btn:active { opacity:.85; }
  .linkbtn { background:none; border:none; color:var(--sub); font-size:11px; text-decoration:underline; cursor:pointer; }
  .note { font-size:11px; color:var(--sub); text-align:center; margin-top:18px; line-height:1.6; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">TODAY'S LOOK</div>
    <div class="date" id="date"></div>
  </div>

  <div class="hero">
    <div class="eyebrow">FEELS LIKE · 출근 시간 체감온도</div>
    <div id="wIcon"></div>
    <div class="temp" id="wTemp"></div>
    <div class="desc" id="wDesc"></div>
  </div>

  <div class="bar">
    <div class="tabs" id="gender">
      <button data-v="m" class="on">MEN</button>
      <button data-v="w">WOMEN</button>
    </div>
    <div class="sp"></div>
    <select id="city" aria-label="지역"></select>
    <select id="hour" aria-label="출근 시간">
      <option value="7">7시</option><option value="8" selected>8시</option>
      <option value="9">9시</option><option value="10">10시</option>
    </select>
    <button class="iconbtn" id="locate">내 위치</button>
  </div>
  <div class="meta" id="status"></div>
  <details class="test">
    <summary>테스트 모드 (날씨 직접 정하기)</summary>
    <label>체감온도</label>
    <input type="range" id="temp" min="-10" max="35" value="12">
    <label><input type="checkbox" id="rain"> 비 오는 날</label>
  </details>

  <div id="outfit"></div>
  <div id="tip2"></div>

  <button class="btn" id="another">다른 조합 보기</button>
  <div class="note"><button class="linkbtn" id="resetFb">내 취향 초기화</button></div>
  <div class="note">링크는 쇼핑몰 검색 결과로 이동합니다.<br>쇼핑몰 주소가 바뀌면 링크가 달라질 수 있어요.</div>
</div>

    sets: [

      { m: { 아우터:"싱글 코트", 상의:"가디건 + 셔츠", 하의:"슬랙스", 신발:"부츠" },
        w: { 아우터:"더블 코트", 상의:"터틀넥", 하의:"스커트 + 기모 스타킹", 신발:"부츠" } },
      { m: { 아우터:"캐시미어 블렌드 코트", 상의:"케이블 니트", 하의:"그레이 울 슬랙스", 신발:"더비 슈즈" },
        w: { 아우터:"캐시미어 블렌드 코트", 상의:"케이블 니트", 하의:"울 와이드 팬츠", 신발:"앵클 부츠" } },
      { m: { 아우터:"네이비 더플 코트", 상의:"터틀넥 + 셔츠", 하의:"차콜 슬랙스", 신발:"첼시 부츠" },
        w: { 아우터:"체스터 코트", 상의:"터틀넥", 하의:"기모 슬랙스", 신발:"첼시 부츠" } },
      { m: { 아우터:"경량 패딩 + 울 머플러", 상의:"니트", 하의:"기모 슬랙스", 신발:"부츠" },
        w: { 아우터:"숏 패딩 + 울 머플러", 상의:"니트", 하의:"기모 슬랙스", 신발:"부츠" } },
      { m: { 아우터:"블랙 롱코트", 상의:"화이트 셔츠 + 니트 베스트", 하의:"블랙 슬랙스", 신발:"첼시 부츠" },
        w: { 아우터:"블랙 롱코트", 상의:"화이트 블라우스 + 니트 베스트", 하의:"블랙 슬랙스", 신발:"롱 부츠" } } ] },
  { min: -99, label: "한겨울", tip: "내복·목도리·장갑까지 챙기세요",
    sets: [
      { m: { 아우터:"롱패딩", 상의:"기모 니트", 하의:"기모 슬랙스", 신발:"방한 부츠" },
        w: { 아우터:"롱패딩", 상의:"기모 니트", 하의:"기모 슬랙스", 신발:"방한 부츠" } },
      { m: { 아우터:"두꺼운 울 코트", 상의:"히트텍 + 니트", 하의:"기모 슬랙스", 신발:"첼시 부츠" },
        w: { 아우터:"두꺼운 울 코트", 상의:"히트텍 + 터틀넥", 하의:"기모 슬랙스", 신발:"방한 부츠" } },
      { m: { 아우터:"숏 구스다운 패딩", 상의:"터틀넥 니트", 하의:"기모 치노 팬츠", 신발:"방한 첼시 부츠" },
        w: { 아우터:"숏 구스다운 패딩", 상의:"터틀넥 니트", 하의:"기모 와이드 팬츠", 신발:"방한 부츠" } },
      { m: { 아우터:"울 코트 + 패딩 베스트", 상의:"두꺼운 니트", 하의:"기모 울 슬랙스", 신발:"방한 부츠" },
        w: { 아우터:"울 코트 + 패딩 베스트", 상의:"두꺼운 니트", 하의:"기모 울 슬랙스", 신발:"방한 부츠" } },
      { m: { 아우터:"후드 롱패딩", 상의:"셔츠 + 기모 가디건", 하의:"기모 슬랙스", 신발:"방한 더비 슈즈" },
        w: { 아우터:"벨티드 롱패딩", 상의:"셔츠 + 기모 가디건", 하의:"기모 슬랙스", 신발:"롱 부츠" } } ] },
];

// ===== 2. 쇼핑몰 검색 링크 =====
const SHOPS = [
  { name:"무신사",  url:q => "https://www.musinsa.com/search/goods?keyword=" + q },
  { name:"29CM",    url:q => "https://search.29cm.co.kr/?keyword=" + q },
  { name:"네이버", url:q => "https://search.shopping.naver.com/search/all?query=" + q },
];

// ===== 3. 화면 =====
let gender = "m", setIndex = 0, order = null;
const $ = id => document.getElementById(id);

// ===== 취향 저장 (이 브라우저 안에 저장돼요) =====
const FB_STORE = "outfitFeedback";
function loadFb() { try { return JSON.parse(localStorage.getItem(FB_STORE)) || {}; } catch (e) { return {}; } }
function saveFb(data) { try { localStorage.setItem(FB_STORE, JSON.stringify(data)); } catch (e) {} }
let feedback = loadFb();
const fbKey = (band, i) => gender + "-" + band.min + "-" + i;
const getFb = key => feedback[key] || 0;
function setFb(key, v) {
  if (feedback[key] === v) delete feedback[key]; else feedback[key] = v; // 같은 버튼 다시 누르면 취소
  saveFb(feedback);
}

// ===== 실제 날씨 (Open-Meteo: 무료, API 키 필요 없음) =====
const CITIES = {
  "서울": [37.5665, 126.9780], "인천": [37.4563, 126.7052], "수원": [37.2636, 127.0286],
  "대전": [36.3504, 127.3845], "대구": [35.8714, 128.6014], "부산": [35.1796, 129.0756],
  "광주": [35.1595, 126.8526], "울산": [35.5384, 129.3114], "제주": [33.4996, 126.5312],
};
let weather = { temp: 12, rain: false, min: null, max: null, pop: null };

async function loadWeather(lat, lon, label) {
  $("status").textContent = "날씨 불러오는 중...";
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&hourly=apparent_temperature,precipitation_probability&daily=temperature_2m_max,temperature_2m_min" +
      "&timezone=Asia%2FSeoul&forecast_days=1";
    const d = await (await fetch(url)).json();
    const h = Number($("hour").value);
    const range = [h, h + 1, h + 2, 18]; // 출근 + 퇴근 무렵
    const pop = Math.max(...range.map(i => d.hourly.precipitation_probability[i] || 0));
    weather = {
      temp: Math.round(d.hourly.apparent_temperature[h]),
      rain: pop >= 50,
      min: Math.round(d.daily.temperature_2m_min[0]),
      max: Math.round(d.daily.temperature_2m_max[0]),
      pop,
    };
    $("temp").value = weather.temp; $("rain").checked = weather.rain;
    $("status").textContent = label + " 기준 · 출근 " + h + "시 체감온도";
    setIndex = 0; order = null; render();
  } catch (e) {
    $("status").textContent = "날씨를 불러오지 못했어요. 인터넷 연결을 확인하거나 테스트 모드를 써주세요.";
  }
}

function loadCity() { const c = $("city").value; loadWeather(...CITIES[c], c); }

$("city").innerHTML = Object.keys(CITIES).map(c => `<option>${c}</option>`).join("");
$("city").addEventListener("change", loadCity);
$("hour").addEventListener("change", loadCity);
$("locate").addEventListener("click", () => {
  if (!navigator.geolocation) { $("status").textContent = "이 브라우저는 위치 기능을 지원하지 않아요."; return; }
  navigator.geolocation.getCurrentPosition(
    p => loadWeather(p.coords.latitude, p.coords.longitude, "내 위치"),
    () => { $("status").textContent = "위치 권한이 없어서 지역 선택을 이용해 주세요."; });
});

function weatherIcon(t, rain) {
  if (rain) return "🌧️";
  if (t >= 28) return "☀️"; if (t >= 20) return "🌤️"; if (t >= 10) return "⛅"; if (t >= 0) return "🌥️"; return "❄️";
}


// 아이템 이름에 색 이름이 들어 있으면 작은 색 칩을 보여줘요
const COLORS = { "화이트":"#fff","아이보리":"#f4efe2","크림":"#f3ead2","베이지":"#d8c3a0","카멜":"#b98a4f","브라운":"#6f4a2f",
  "스카이블루":"#8ec1e8","네이비":"#1f2a4a","차콜":"#3a3d42","그레이":"#9a9da1","블랙":"#111" };
function swatch(name) {
  const k = Object.keys(COLORS).find(c => name.includes(c));
  return k ? `<i class="sw" style="background:${COLORS[k]}"></i>` : "";
}

function render() {
  const t = weather.temp, rain = weather.rain;
  const band = OUTFITS.find(b => t >= b.min);
  // 추천 순서: 좋아요 → 아직 평가 안 함 → 싫어요 (순서는 조합을 바꾸기 전까지 고정)
  if (!order || order.bandMin !== band.min) {
    const idx = band.sets.map((_, i) => i);
    const score = i => getFb(fbKey(band, i));
    idx.sort((a, b) => score(b) - score(a) || a - b);
    order = { bandMin: band.min, idx };
  }
  const cur = order.idx[setIndex % order.idx.length];
  const curKey = fbKey(band, cur);
  const fb = getFb(curKey);
  const set = band.sets[cur][gender];

  $("wIcon").textContent = weatherIcon(t, rain);
  $("wTemp").textContent = t + "°";
  let desc = band.label + (rain ? " · 비 예보" : "");
  if (weather.min !== null) {
    desc += " · 최저 " + weather.min + "° / 최고 " + weather.max + "°";
    if (weather.pop !== null) desc += " · 강수확률 " + weather.pop + "%";
  }
  $("wDesc").textContent = desc;
  $("tip2").textContent = (weather.min !== null && weather.max - weather.min >= 10)
    ? "일교차가 " + (weather.max - weather.min) + "°예요. 벗고 입기 편한 겉옷을 챙기세요." : "";

  const items = Object.entries(set).filter(([, name]) => name).map(([part, name]) => ({ part, name }));
  if (rain) {
    items.push({ part: "신발(비 오는 날)", name: "방수 로퍼 / 레인 부츠" });
    items.push({ part: "소품", name: "장우산" });
  }

  $("outfit").innerHTML =
    `<p class="headline">${band.label},<br>이렇게 입어요</p>
     <p class="tip">${band.tip}${rain ? " · 비 오니 젖어도 되는 신발로!" : ""}</p>` +
    items.map((it, n) => {
      const q = encodeURIComponent(it.name);
      const links = SHOPS.map(s => `<a href="${s.url(q)}" target="_blank" rel="noopener">${s.name} ↗</a>`).join("");
      return `<div class="item"><div class="no">${String(n + 1).padStart(2, "0")}</div><div class="body"><div class="part">${it.part}</div><div class="name">${swatch(it.name)}<span>${it.name}</span></div><div class="links">${links}</div></div></div>`;
    }).join("") +
    `<div class="fb">
       <button data-fb="1" class="${fb === 1 ? "on" : ""}">👍 마음에 들어요</button>
       <button data-fb="-1" class="${fb === -1 ? "on bad" : ""}">👎 별로예요</button>
     </div>` +
    (fb === 1 ? `<p class="fbmsg">좋아요! 비슷한 날엔 이 조합을 먼저 보여드릴게요.</p>` : "");
}

$("date").textContent = new Date().toLocaleDateString("ko-KR", { month:"long", day:"numeric", weekday:"long" });
$("temp").addEventListener("input", () => { weather.temp = Number($("temp").value); setIndex = 0; order = null; render(); });
$("rain").addEventListener("change", () => { weather.rain = $("rain").checked; render(); });
$("another").addEventListener("click", () => { setIndex++; render(); });
$("outfit").addEventListener("click", e => {
  const v = e.target.dataset.fb;
  if (!v) return;
  const band = OUTFITS.find(b => weather.temp >= b.min);
  setFb(fbKey(band, order.idx[setIndex % order.idx.length]), Number(v));
  if (v === "-1") setIndex++; // 싫어요 → 바로 다음 조합
  render();
});
$("resetFb").addEventListener("click", () => {
  if (!confirm("지금까지의 좋아요/싫어요를 모두 지울까요?")) return;
  feedback = {}; saveFb(feedback); order = null; setIndex = 0; render();
});
$("gender").addEventListener("click", e => {
  if (!e.target.dataset.v) return;
  gender = e.target.dataset.v; order = null; setIndex = 0;
  document.querySelectorAll("#gender button").forEach(b => b.classList.toggle("on", b === e.target));
  render();
});
render();
loadCity(); // 처음 열면 서울 날씨부터 불러오기

// 앱으로 설치 가능하게 (웹 주소로 열었을 때만 동작)
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
