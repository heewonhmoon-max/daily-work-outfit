<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 출근룩</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="출근룩">
<style>
  :root { --bg:#fff; --text:#111; --sub:#8a8a8a; --line:#e9e9e9; --ink:#111; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased; letter-spacing:-0.01em; }
  .wrap { max-width:480px; margin:0 auto; padding:0 20px 56px; }
  button, select { font-family:inherit; color:inherit; }

  /* 상단 바 */
  .top { display:flex; justify-content:space-between; align-items:baseline; padding:20px 0 14px; border-bottom:1px solid var(--ink); }
  .brand { font-size:13px; font-weight:800; letter-spacing:0.14em; }
  .date { font-size:12px; color:var(--sub); }

  /* 날씨 */
  .hero { padding:28px 0 22px; }
  .hero .eyebrow { font-size:11px; letter-spacing:0.14em; color:var(--sub); font-weight:600; }
  .hero .temp { font-size:96px; line-height:1; font-weight:200; letter-spacing:-0.06em; margin:6px 0 10px -4px; }
  .hero .desc { font-size:13px; color:#555; line-height:1.6; }
  #wIcon { display:none; }

  /* 설정 줄 */
  .bar { display:flex; align-items:center; gap:18px; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tabs { display:flex; gap:16px; }
  .tabs button { background:none; border:none; padding:2px 0; font-size:13px; font-weight:700; letter-spacing:0.08em; color:#bbb; cursor:pointer; border-bottom:2px solid transparent; }
  .tabs button.on { color:var(--ink); border-bottom-color:var(--ink); }
  .bar .sp { flex:1; }
  select { appearance:none; -webkit-appearance:none; background:none; border:none; font-size:13px; font-weight:500; padding:2px 14px 2px 0; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,#111 50%),linear-gradient(135deg,#111 50%,transparent 50%);
    background-position:calc(100% - 6px) 55%, calc(100% - 2px) 55%; background-size:4px 4px; background-repeat:no-repeat; }
  .iconbtn { background:none; border:none; font-size:13px; font-weight:500; cursor:pointer; padding:2px 0; text-decoration:underline; text-underline-offset:3px; }
  .meta { font-size:11px; color:var(--sub); padding:10px 0 0; min-height:22px; }
  details.test { margin-top:6px; }
  details.test summary { font-size:11px; color:var(--sub); cursor:pointer; }
  details.test label { display:block; font-size:12px; color:var(--sub); margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#111; }

  /* 코디 */
  #outfit { padding:34px 0 8px; }
  .headline { font-size:24px; line-height:1.3; font-weight:800; margin:0 0 6px; letter-spacing:-0.03em; }
  .tip { color:#666; font-size:14px; margin:0 0 26px; line-height:1.5; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:22px 12px; }
  .tile .img { aspect-ratio:1; background:#f4f4f4; display:flex; align-items:center; justify-content:center; padding:14%; }
  .tile .img svg { width:100%; height:100%; }
  .mood { margin:0 0 26px; }
  .mood img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#f4f4f4; }
  .credit { font-size:10px; color:var(--sub); margin-top:6px; }
  .credit a { color:inherit; }
  .tile .part { font-size:11px; color:var(--sub); letter-spacing:0.1em; margin:10px 0 3px; }
  .tile .name { font-size:15px; font-weight:600; line-height:1.35; letter-spacing:-0.02em; }

  /* 피드백 / 버튼 */
  .fb { display:flex; gap:8px; margin-top:26px; }
  .fb button { flex:1; padding:13px 0; border-radius:2px; border:1px solid var(--ink); background:#fff; font-size:13px; font-weight:600; cursor:pointer; }
  .fb button.on { background:var(--ink); color:#fff; }
  .fbmsg { font-size:12px; color:#555; margin:12px 0 0; }
  #tip2 { font-size:12px; color:#555; background:#f6f6f6; padding:12px 14px; margin-top:18px; line-height:1.5; }
  #tip2:empty { display:none; }
  .btn { width:100%; padding:17px; border-radius:2px; border:none; background:var(--ink); color:#fff; font-size:14px; font-weight:700; letter-spacing:0.02em; cursor:pointer; margin-top:18px; }
  .btn:active { opacity:.85; }
  .linkbtn { background:none; border:none; color:var(--sub); font-size:11px; text-decoration:underline; cursor:pointer; }

  [hidden] { display:none !important; }
  .views { display:flex; gap:22px; padding:14px 0 0; border-bottom:1px solid var(--line); }
  .views button { background:none; border:none; padding:6px 0 12px; font-size:14px; font-weight:700; color:#b5b5b5; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .views button.on { color:var(--ink); border-bottom-color:var(--ink); }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--ink); margin-top:10px; }
  .btn.small { width:auto; padding:11px 16px; font-size:13px; margin:0; }
  .empty { padding:34px 0 8px; }
  .sug { display:flex; gap:14px; align-items:center; margin-top:26px; padding:14px; border:1px dashed #bdbdbd; }
  .sugimg { width:84px; height:84px; flex:none; background:#f4f4f4; padding:10px; }
  .sugimg svg { width:100%; height:100%; }
  .sugtag { font-size:10px; letter-spacing:0.08em; color:var(--sub); margin-bottom:4px; }
  .sugname { font-size:15px; font-weight:700; letter-spacing:-0.02em; }
  .sugwhy { font-size:12px; color:#666; margin-top:4px; line-height:1.5; }
  .chead { display:flex; justify-content:space-between; align-items:flex-end; padding:26px 0 16px; }
  .chead .eyebrow { font-size:11px; letter-spacing:0.14em; color:var(--sub); font-weight:600; }
  .ctitle { font-size:24px; font-weight:800; letter-spacing:-0.03em; margin-top:4px; }
  .ctitle span { font-size:14px; font-weight:500; color:var(--sub); }
  .form { border:1px solid var(--ink); padding:18px; margin-bottom:22px; }
  .ftitle { font-size:15px; font-weight:800; margin-bottom:12px; }
  .form label { display:block; font-size:11px; color:var(--sub); letter-spacing:0.06em; margin-top:12px; }
  .form input[type=text], .form select { display:block; width:100%; margin-top:6px; padding:10px 0; font-size:15px; border:none; border-bottom:1px solid #cfcfcf; border-radius:0; background:none; color:var(--text); font-family:inherit; outline:none; }
  .form input[type=text]:focus, .form select:focus { border-bottom-color:var(--ink); }
  .form select { background-position:calc(100% - 6px) 55%, calc(100% - 2px) 55%; }
  .frow { display:flex; gap:16px; } .frow label { flex:1; }
  .form label.chk { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); letter-spacing:0; margin-top:16px; }
  .fbtns { display:flex; gap:8px; margin-top:6px; } .fbtns .btn { margin-top:14px; }
  #fDelete { margin-top:14px; color:#c33; }
  .cpart { margin-top:24px; }
  .cptitle { font-size:12px; letter-spacing:0.1em; font-weight:700; margin-bottom:10px; }
  .cptitle span { color:var(--sub); font-weight:500; }
  .grid.g3 { grid-template-columns:repeat(3,1fr); gap:16px 8px; }
  .ctile { background:none; border:none; padding:0; text-align:left; cursor:pointer; font-family:inherit; color:inherit; }
  .ctile .name { font-size:12px; font-weight:600; margin-top:6px; }
  .ctile .meta2 { font-size:10px; color:var(--sub); margin-top:2px; }
  .ctile .img { padding:10%; }
  .note { font-size:11px; color:var(--sub); text-align:center; margin-top:18px; line-height:1.6; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">TODAY'S LOOK</div>
    <div class="date" id="date"></div>
  </div>

  <div class="views" id="views">
    <button data-view="today" class="on">오늘의 코디</button>
    <button data-view="closet">내 옷장</button>
  </div>

<div id="viewToday">
  <div class="hero">
    <div class="eyebrow">FEELS LIKE · 출근 시간 체감온도</div>
    <div id="wIcon"></div>
    <div class="temp" id="wTemp"></div>
    <div class="desc" id="wDesc"></div>
  </div>

  <div class="bar">
    <div class="tabs" id="gender">
      <button data-v="m" class="on">MEN</button>
      <button data-v="w">WOMEN</button>
    </div>
    <div class="sp"></div>
    <select id="city" aria-label="지역"></select>
    <select id="hour" aria-label="출근 시간">
      <option value="7">7시</option><option value="8" selected>8시</option>
      <option value="9">9시</option><option value="10">10시</option>
    </select>
    <button class="iconbtn" id="locate">내 위치</button>
  </div>
  <div class="meta" id="status"></div>
  <details class="test">
    <summary>테스트 모드 (날씨 직접 정하기)</summary>
    <label>체감온도</label>
    <input type="range" id="temp" min="-10" max="35" value="12">
    <label><input type="checkbox" id="rain"> 비 오는 날</label>
  </details>

  <div id="outfit"></div>
  <div id="tip2"></div>

  <button class="btn" id="another">다른 조합 보기</button>
  <div class="note"><button class="linkbtn" id="resetFb">내 취향 초기화</button></div>
  <div class="note">옷 그림은 이해를 돕는 일러스트예요.<br>실제 옷의 모양과 색은 다를 수 있어요.<br>옷장과 취향은 이 기기에만 저장돼요.</div>
</div>

<div id="viewCloset" hidden>
  <div class="chead">
    <div><div class="eyebrow">MY CLOSET</div><div class="ctitle">내 옷장 <span id="cCount"></span></div></div>
    <button class="btn small" id="addItem">+ 옷 추가</button>
  </div>
  <div id="formWrap" class="form" hidden>
    <div class="ftitle" id="fTitle">옷 추가</div>
    <label>이름<input id="fName" type="text" placeholder="예: 네이비 울 코트" maxlength="30" autocomplete="off"></label>
    <div class="frow">
      <label>부위<select id="fPart"></select></label>
      <label>종류<select id="fKind"></select></label>
    </div>
    <div class="frow">
      <label>색<select id="fColor"></select></label>
      <label>두께<select id="fWarm"><option value="1">얇음</option><option value="2" selected>보통</option><option value="3">두꺼움</option></select></label>
    </div>
    <label class="chk"><input type="checkbox" id="fRain"> 비 오는 날 입어도 괜찮아요 (방수·젖어도 OK)</label>
    <div class="fbtns">
      <button class="btn" id="fSave">저장</button>
      <button class="btn ghost" id="fCancel">취소</button>
    </div>
    <button class="linkbtn" id="fDelete" hidden>이 옷 삭제</button>
  </div>
  <div id="closetList"></div>
</div>
</div>

<script>
// ===== 1. 코디 데이터: 온도 구간별 조합 (m=남성, w=여성) =====
// 각 구간에 조합을 여러 개 넣어두면 "다른 조합 보기"로 돌려볼 수 있어요.
const OUTFITS = [
  { min: 28, label: "무더운 날", tip: "통풍 잘 되는 소재로 시원하게",
    sets: [
      { m: { 상의:"반팔 오픈카라 셔츠", 하의:"린넨 블렌드 슬랙스", 신발:"로퍼" },
        w: { 상의:"반팔 블라우스", 하의:"린넨 와이드 슬랙스", 신발:"뮬 로퍼" } },
      { m: { 상의:"피케 반팔 티셔츠", 하의:"코튼 치노 팬츠", 신발:"더비 슈즈" },
        w: { 상의:"반팔 니트 탑", 하의:"A라인 롱스커트", 신발:"플랫 슈즈" } },
      { m: { 상의:"화이트 반팔 옥스포드 셔츠", 하의:"네이비 쿨 슬랙스", 신발:"스웨이드 로퍼" },
        w: { 상의:"화이트 반팔 셔츠", 하의:"베이지 와이드 팬츠", 신발:"슬링백" } },
      { m: { 상의:"스트라이프 반팔 셔츠", 하의:"크림 코튼 팬츠", 신발:"캔버스 더비" },
        w: { 상의:"린넨 셔츠 원피스", 하의:"", 신발:"샌들 로퍼" } },
      { m: { 상의:"세미 오버 반팔 셔츠", 하의:"그레이 린넨 슬랙스", 신발:"페니 로퍼" },
        w: { 상의:"퍼프 반팔 블라우스", 하의:"하이웨이스트 쇼츠 슬랙스", 신발:"뮬" } } ] },
  { min: 23, label: "더운 날", tip: "냉방 대비 얇은 겉옷 하나 챙기세요",
    sets: [
      { m: { 상의:"긴팔 옥스포드 셔츠", 하의:"코튼 슬랙스", 신발:"로퍼" },
        w: { 상의:"얇은 셔츠 블라우스", 하의:"슬랙스", 신발:"로퍼" } },
      { m: { 상의:"반팔 셔츠", 하의:"밝은 슬랙스", 신발:"더비 슈즈" },
        w: { 상의:"반팔 니트", 하의:"미디 스커트", 신발:"슬링백" } },
      { m: { 상의:"셔츠 + 얇은 썸머 가디건", 하의:"베이지 치노 팬츠", 신발:"로퍼" },
        w: { 상의:"반팔 블라우스 + 얇은 가디건", 하의:"테이퍼드 슬랙스", 신발:"플랫 슈즈" } },
      { m: { 상의:"린넨 셔츠 재킷", 하의:"화이트 티셔츠 + 슬랙스", 신발:"스니커즈(깔끔한)" },
        w: { 상의:"린넨 블레이저", 하의:"화이트 이너 + 와이드 팬츠", 신발:"로퍼" } },
      { m: { 상의:"스카이블루 셔츠", 하의:"네이비 슬랙스", 신발:"더비 슈즈" },
        w: { 상의:"스카이블루 셔츠", 하의:"플리츠 롱스커트", 신발:"슬링백" } } ] },
  { min: 20, label: "선선한 날", tip: "얇은 가디건이나 셔츠 겹쳐 입기 좋아요",
    sets: [
      { m: { 상의:"셔츠 + 얇은 가디건", 하의:"슬랙스", 신발:"로퍼" },
        w: { 상의:"블라우스 + 얇은 가디건", 하의:"슬랙스", 신발:"로퍼" } },
      { m: { 상의:"긴팔 니트 폴로", 하의:"치노 팬츠", 신발:"스니커즈(깔끔한)" },
        w: { 상의:"라운드 니트", 하의:"플리츠 스커트", 신발:"플랫 슈즈" } },
      { m: { 상의:"헨리넥 긴팔 + 얇은 블레이저", 하의:"그레이 슬랙스", 신발:"더비 슈즈" },
        w: { 상의:"니트 + 얇은 블레이저", 하의:"스트레이트 팬츠", 신발:"로퍼" } },
      { m: { 상의:"옥스포드 셔츠 (소매 걷기)", 하의:"네이비 치노", 신발:"보트 슈즈" },
        w: { 상의:"스트라이프 셔츠", 하의:"블랙 슬랙스", 신발:"플랫 슈즈" } },
      { m: { 상의:"라이트 니트 베스트 + 셔츠", 하의:"베이지 슬랙스", 신발:"로퍼" },
        w: { 상의:"니트 베스트 + 블라우스", 하의:"A라인 스커트", 신발:"메리제인 슈즈" } },
      { m: { 상의:"반팔 니트 + 셔츠 레이어드", 하의:"차콜 슬랙스", 신발:"더비 슈즈" },
        w: { 상의:"카디건 세트 (니트 투피스)", 하의:"슬랙스", 신발:"로퍼" } } ] },
  { min: 17, label: "쌀쌀한 날", tip: "니트나 얇은 재킷이 딱 좋아요",
    sets: [
      { m: { 상의:"니트 + 셔츠", 하의:"울 슬랙스", 신발:"더비 슈즈" },
        w: { 상의:"니트 + 셔츠", 하의:"울 슬랙스", 신발:"로퍼" } },
      { m: { 상의:"셔츠 + 블레이저", 하의:"슬랙스", 신발:"로퍼" },
        w: { 상의:"블라우스 + 블레이저", 하의:"슬랙스", 신발:"로퍼" } },
      { m: { 상의:"네이비 블레이저 + 라운드 니트", 하의:"그레이 슬랙스", 신발:"더비 슈즈" },
        w: { 상의:"베이지 블레이저 + 니트", 하의:"화이트 팬츠", 신발:"로퍼" } },
      { m: { 상의:"가디건 + 옥스포드 셔츠", 하의:"치노 팬츠", 신발:"로퍼" },
        w: { 상의:"롱 가디건 + 블라우스", 하의:"스트레이트 팬츠", 신발:"플랫 슈즈" } },
      { m: { 상의:"하프집업 니트", 하의:"코튼 슬랙스", 신발:"스니커즈(깔끔한)" },
        w: { 상의:"셔츠 + 니트 베스트", 하의:"미디 스커트", 신발:"앵클 부츠" } },
      { m: { 상의:"브라운 니트 + 화이트 셔츠", 하의:"베이지 슬랙스", 신발:"스웨이드 로퍼" },
        w: { 상의:"브라운 니트 + 화이트 셔츠", 하의:"블랙 슬랙스", 신발:"로퍼" } } ] },
  { min: 12, label: "꽤 쌀쌀한 날", tip: "자켓이나 트렌치코트를 꺼낼 때예요",

const KINDS = [

const DEFAULT_FILL = { padding:"#3b3f46", coat:"#8c8173", jacket:"#6b7078", dress:"#2f3340", skirt:"#4a4a4f", pants:"#43474e",
  boot:"#2b2320", shoe:"#3a2c25", umbrella:"#1f2a4a", turtle:"#cbbfae", knit:"#cbbfae", shirt:"#f2f2f2", tee:"#e8e4dc" };

// 이름 속 첫 번째 색 이름 (없으면 빈 문자열)
function colorName(name) {
  let best = "", pos = 999;
  for (const c in COLORS) { const i = name.indexOf(c); if (i >= 0 && i < pos) { pos = i; best = c; } }
  return best;
}
function kindOf(name) { const k = KINDS.find(([, re]) => re.test(name)); return k ? k[0] : "tee"; }
function colorOf(name, kind) {
  let best = null, pos = 999;
  for (const c in COLORS) { const i = name.indexOf(c); if (i >= 0 && i < pos) { pos = i; best = c; } }
  return best ? COLORS[best] : DEFAULT_FILL[kind];
}
function isDark(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) < 120;
}

function garmentSVG(name, opts = {}) {

  const P = (d, extra = "") => `<path d="${d}" fill="${fill}" stroke="#111" stroke-width="1.6" stroke-linejoin="round" ${extra}/>`;

}

  "대전": [36.3504, 127.3845], "대구": [35.8714, 128.6014], "부산": [35.1796, 129.0756],
  "광주": [35.1595, 126.8526], "울산": [35.5384, 129.3114], "제주": [33.4996, 126.5312],
};
let weather = { temp: 12, rain: false, min: null, max: null, pop: null };

async function loadWeather(lat, lon, label) {
  $("status").textContent = "날씨 불러오는 중...";
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&hourly=apparent_temperature,precipitation_probability&daily=temperature_2m_max,temperature_2m_min" +
      "&timezone=Asia%2FSeoul&forecast_days=1";
    const d = await (await fetch(url)).json();
    const h = Number($("hour").value);
    const range = [h, h + 1, h + 2, 18]; // 출근 + 퇴근 무렵
    const pop = Math.max(...range.map(i => d.hourly.precipitation_probability[i] || 0));
    weather = {
      temp: Math.round(d.hourly.apparent_temperature[h]),
      rain: pop >= 50,
      min: Math.round(d.daily.temperature_2m_min[0]),
      max: Math.round(d.daily.temperature_2m_max[0]),
      pop,
    };
    $("temp").value = weather.temp; $("rain").checked = weather.rain;
    $("status").textContent = label + " 기준 · 출근 " + h + "시 체감온도";
    setIndex = 0; order = null; render();
  } catch (e) {
    $("status").textContent = "날씨를 불러오지 못했어요. 인터넷 연결을 확인하거나 테스트 모드를 써주세요.";
  }
}

// ===== 4. 오늘의 코디 고르기 (내 옷장 안에서) =====
const NEUTRAL = ["화이트", "아이보리", "크림", "베이지", "카멜", "브라운", "그레이", "차콜", "블랙", "네이비"];
const DARKISH = ["블랙", "네이비", "그레이", "차콜"];
const pool = part => closet.filter(i => i.part === part);

// 기온에 따라 필요한 두께 (1 얇음 · 2 보통 · 3 두꺼움, 아우터 0은 필요 없음)
function needFor(t, range) {
  let n;
  if (t >= 28) n = { outer:0, top:1, bottom:1 };
  else if (t >= 23) n = { outer:0, top:1, bottom:1 };
  else if (t >= 20) n = { outer:1, top:1, bottom:1 };
  else if (t >= 17) n = { outer:1, top:2, bottom:2 };
  else if (t >= 9)  n = { outer:2, top:2, bottom:2 };
  else if (t >= 5)  n = { outer:3, top:2, bottom:3 };
  else              n = { outer:3, top:3, bottom:3 };
  if (n.outer === 0 && t < 28 && range >= 10) n.outer = 1; // 일교차 크면 얇은 겉옷
  return n;
}
function hash(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function recentlyWorn(item) {
  const base = Date.parse(todayStr());
  return (item.worn || []).some(d => { const n = Math.round((base - Date.parse(d)) / 864e5); return n >= 1 && n <= 2; });
}
const comboItems = c => [c.outer, c.top, c.bottom, c.shoe].filter(Boolean);
const comboKey = c => "c:" + comboItems(c).map(i => i.id).sort().join("+");

function buildCombos(t, rain, range) {
  const need = needFor(t, range);
  const O = [null, ...pool("아우터")];
  const T = [...pool("상의"), ...pool("원피스")], B = pool("하의"), S = pool("신발");
  const Tn = T.length ? T : [null], Bn = B.length ? B : [null], Sn = S.length ? S : [null];
  const today = todayStr(), res = [];
  for (const o of O) for (const tp of Tn) for (const b of (tp && tp.part === "원피스" ? [null] : Bn)) for (const s of Sn) {
    let sc = 0;
    // 두께가 날씨에 맞는지
    sc -= o ? Math.abs(o.warmth - need.outer) * 3 : (need.outer ? need.outer * 3 + 1 : 0);
    sc -= tp ? Math.abs(tp.warmth - need.top) * 2 + (tp.part === "원피스" ? 1 : 0) : need.top * 2 + 1;
    sc -= b ? Math.abs(b.warmth - need.bottom) * 2 : (tp && tp.part === "원피스" ? 0 : need.bottom * 2 + 1);
    // 비 오는 날은 방수되는 신발·아우터
    if (rain) { if (s) sc += s.rain ? 4 : -4; if (o && o.rain) sc += 1.5; }
    // 계절에 맞는 신발
    if (s && s.kind === "boot") sc += t < 10 ? 1.5 : (t >= 23 ? -2 : 0);
    // 색 조합
    const cols = [o, tp, b].filter(Boolean).map(colorOfItem).filter(Boolean);
    const vivid = cols.filter(c => !NEUTRAL.includes(c)).length;
    if (vivid > 1) sc -= 2.5; else if (vivid === 0 && cols.length) sc += 1;
    if (tp && b && colorOfItem(tp) && colorOfItem(tp) === colorOfItem(b) && !DARKISH.includes(colorOfItem(tp))) sc -= 2;
    if (s && s.color === "브라운" && b && colorOfItem(b) === "블랙") sc -= 1;
    // 최근 입은 옷은 피하기
    for (const i of [o, tp, b, s]) if (i && recentlyWorn(i)) sc -= 3;
    const c = { outer: o, top: tp, bottom: b, shoe: s };
    const key = comboKey(c);
    sc += feedback[key] === 1 ? 5 : feedback[key] === -1 ? -8 : 0;
    sc += (hash(today + key) % 100) / 110; // 같은 점수면 날마다 조금씩 다르게
    c.sc = sc; c.key = key; res.push(c);
  }
  res.sort((a, b) => b.sc - a.sc);
  // 서로 너무 비슷한 조합은 건너뛰고 다양하게
  const shared = (a, b) => comboItems(a).filter(i => comboItems(b).includes(i)).length;
  const picked = [];
  for (const c of res) { if (picked.length >= 6) break; if (picked.every(p => shared(p, c) <= 2)) picked.push(c); }
  for (const c of res) { if (picked.length >= Math.min(6, res.length)) break; if (!picked.includes(c)) picked.push(c); }
  return { list: picked, need };
}

// 옷장에 없지만 있으면 좋은 아이템 1개
function suggestion(combo, band, need, t, rain, range) {
  const set = band.sets[(hash(todayStr()) + setIndex) % band.sets.length][gender];
  const mk = (part, name, why) => ({ part, name, why });
  if (rain && !(combo.shoe && combo.shoe.rain)) return mk("신발", "방수 로퍼 / 레인 부츠", "비 예보예요. 젖어도 괜찮은 신발이 있으면 마음이 편해요");
  for (const part of ["상의", "하의", "신발"]) {
    const hasDress = part !== "신발" && pool("원피스").length;
    if (!pool(part).length && !hasDress && set[part]) return mk(part, set[part], `옷장에 ${part}가 없어요. 이런 ${part}는 어때요?`);
  }
  if (need.outer >= 2 && set["아우터"] && (!combo.outer || Math.abs(combo.outer.warmth - need.outer) >= 2))
    return mk("아우터", set["아우터"], `${t}°엔 이런 아우터가 있으면 든든해요`);
  if (need.outer === 1 && range >= 10 && !pool("아우터").some(i => i.warmth <= 1))
    return mk("아우터", "얇은 가디건", `일교차가 ${range}°예요. 걸치기 좋은 얇은 겉옷이 있으면 좋아요`);
  if (combo.top && combo.top.part !== "원피스" && Math.abs(combo.top.warmth - need.top) >= 2 && set["상의"])
    return mk("상의", set["상의"], "오늘 날씨에 더 잘 맞는 상의예요");
  if (combo.bottom && Math.abs(combo.bottom.warmth - need.bottom) >= 2 && set["하의"])
    return mk("하의", set["하의"], "오늘 날씨에 더 잘 맞는 하의예요");
  for (const part of ["아우터", "신발", "상의", "하의"]) {
    const name = set[part]; if (!name) continue;
    if (!closet.some(i => i.kind === kindOf(name))) return mk(part, name, "옷장에 없는 종류예요. 하나쯤 있으면 코디 폭이 넓어져요");
  }
  // 다 가지고 있다면: 오늘 날씨에 어울리는 다른 스타일 제안
  const opts = ["아우터", "상의", "하의"].filter(p => set[p]);
  const part = opts.length ? opts[(hash(todayStr()) + setIndex) % opts.length] : "신발";
  return mk(part, set[part], "이런 스타일은 어때요? 옷장에 하나 더하면 코디가 다채로워져요");
}

// ===== 5. 오늘 화면 =====
const tileHtml = item => `<div class="tile"><div class="img">${itemArt(item)}</div><div class="part">${item.part}</div><div class="name">${esc(item.name)}</div></div>`;

function render() {
  const t = weather.temp, rain = weather.rain;
  const range = weather.min !== null ? weather.max - weather.min : 0;
  const band = OUTFITS.find(b => t >= b.min);

  $("wTemp").textContent = t + "°";
  let desc = band.label + (rain ? " · 비 예보" : "");
  if (weather.min !== null) {
    desc += " · 최저 " + weather.min + "° / 최고 " + weather.max + "°";
    if (weather.pop !== null) desc += " · 강수확률 " + weather.pop + "%";
  }
  $("wDesc").textContent = desc;
  $("tip2").textContent = range >= 10 ? "일교차가 " + range + "°예요. 벗고 입기 편한 겉옷을 챙기세요." : "";
  $("another").hidden = !closet.length;

  if (!closet.length) {
    $("outfit").innerHTML = `<div class="empty">
      <p class="headline">옷장을 먼저<br>채워볼까요?</p>
      <p class="tip">내가 가진 옷으로 오늘 날씨에 맞는 코디를 골라 드려요.</p>
      <button class="btn" data-act="goCloset">내 옷 추가하기</button>
      <button class="btn ghost" data-act="sample">샘플 옷장으로 먼저 써보기</button></div>`;
    return;
  }

  if (!order) order = buildCombos(t, rain, range);
  const combo = order.list[setIndex % order.list.length];
  const fb = feedback[combo.key] || 0;
  const sug = suggestion(combo, band, order.need, t, rain, range);
  const worn = comboItems(combo).every(i => (i.worn || []).includes(todayStr()));

  $("outfit").innerHTML =
    `<p class="headline">${band.label},<br>오늘은 이렇게 입어요</p>
     <p class="tip">${band.tip}${rain ? " · 비 오니 젖어도 되는 신발로!" : ""}</p>
     <div class="grid">${comboItems(combo).map(tileHtml).join("")}</div>
     <div class="sug">
       <div class="sugimg">${garmentSVG(sug.name)}</div>
       <div class="sugtxt"><div class="sugtag">있으면 좋은 아이템 · ${sug.part}</div>
         <div class="sugname">${esc(sug.name)}</div><div class="sugwhy">${esc(sug.why)}</div></div>
     </div>
     <div class="fb">
       <button data-fb="1" class="${fb === 1 ? "on" : ""}">👍 마음에 들어요</button>
       <button data-fb="-1" class="${fb === -1 ? "on bad" : ""}">👎 별로예요</button>
     </div>
     <button class="btn ghost" data-worn="1">${worn ? "✓ 오늘 입은 옷으로 기록됨 (누르면 취소)" : "오늘 이걸로 입을게요"}</button>` +
    (fb === 1 ? `<p class="fbmsg">좋아요! 비슷한 날엔 이 조합을 먼저 보여드릴게요.</p>` : "") +
    (worn ? `<p class="fbmsg">기록했어요. 내일은 다른 옷을 먼저 추천할게요.</p>` : "");
}

// ===== 6. 내 옷장 화면 =====
function renderCloset() {

  if (!closet.length) {
    $("closetList").innerHTML = `<div class="empty"><p class="tip">아직 등록한 옷이 없어요.<br>위의 <b>+ 옷 추가</b>로 한 벌씩 등록하거나, 샘플로 먼저 둘러볼 수 있어요.</p>

}

// 옷 추가·수정 폼
let editingId = null;
const touched = {}; // 사용자가 직접 바꾼 칸은 자동 입력으로 덮어쓰지 않아요
function fillKinds(part, keep) {
  $("fKind").innerHTML = PART_KINDS[part].map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
  if (keep && PART_KINDS[part].some(([v]) => v === keep)) $("fKind").value = keep;
}
$("fPart").innerHTML = PARTS.map(p => `<option>${p}</option>`).join("");
$("fColor").innerHTML = `<option value="">(자동 · 이름에서 찾기)</option>` + Object.keys(COLORS).map(c => `<option>${c}</option>`).join("");
function openForm(item) {
  editingId = item ? item.id : null;
  Object.assign(touched, { part: !!item, kind: !!item, color: !!item, warm: !!item });
  $("fTitle").textContent = item ? "옷 수정" : "옷 추가";
  $("fName").value = item ? item.name : "";
  $("fPart").value = item ? item.part : "상의";
  fillKinds($("fPart").value, item && item.kind);
  $("fColor").value = item ? (item.color || "") : "";
  $("fWarm").value = item ? item.warmth : 2;
  $("fRain").checked = !!(item && item.rain);
  $("fDelete").hidden = !item;
  $("formWrap").hidden = false;
  $("fName").focus();
}
function closeForm() { $("formWrap").hidden = true; editingId = null; }

$("fName").addEventListener("input", () => {
  const name = $("fName").value, kind = detectKind(name);
  if (kind) {
    const part = partForKind(kind, name);
    if (!touched.part && part) { $("fPart").value = part; fillKinds(part); }
    if (!touched.kind && PART_KINDS[$("fPart").value].some(([v]) => v === kind)) $("fKind").value = kind;
  }
  const c = colorName(name);
  if (!touched.color && c) $("fColor").value = c;
  if (!touched.warm) $("fWarm").value = guessWarmth($("fKind").value, $("fPart").value, name);
});
$("fPart").addEventListener("change", () => { touched.part = true; fillKinds($("fPart").value); });
$("fKind").addEventListener("change", () => { touched.kind = true; });
$("fColor").addEventListener("change", () => { touched.color = true; });
$("fWarm").addEventListener("change", () => { touched.warm = true; });
$("fCancel").addEventListener("click", closeForm);
$("addItem").addEventListener("click", () => openForm(null));
$("fSave").addEventListener("click", () => {

});
$("fDelete").addEventListener("click", () => {

$("another").addEventListener("click", () => { setIndex++; render(); });
$("gender").addEventListener("click", e => {

$("outfit").addEventListener("click", e => {
  const act = e.target.dataset.act;
  if (act === "goCloset") { setView("closet"); openForm(null); return; }
  if (act === "sample") { loadSample(); return; }
  if (!order) return;
  const combo = order.list[setIndex % order.list.length];
  if (e.target.dataset.fb) {
    const v = Number(e.target.dataset.fb);
    if (feedback[combo.key] === v) delete feedback[combo.key]; else feedback[combo.key] = v;
    saveFeedback();
    if (v === -1 && feedback[combo.key] === -1) setIndex++; // 싫어요 → 바로 다음 조합
    render();
  } else if (e.target.dataset.worn) {
    const today = todayStr(), items = comboItems(combo), already = items.every(i => (i.worn || []).includes(today));
    for (const i of items) {
      const w = (i.worn || []).filter(d => d !== today);
      i.worn = already ? w : [...w, today].slice(-7);
    }
    store.set("outfitCloset", closet); // 기록만 바꾸고 추천 순서는 그대로 둬요
    render();
  }
});
$("resetFb").addEventListener("click", () => {
  if (!confirm("지금까지의 좋아요/싫어요를 모두 지울까요?")) return;
  feedback = {}; saveFeedback(); order = null; setIndex = 0; render();
});

render();
loadCity(); // 처음 열면 서울 날씨부터 불러오기

// 앱으로 설치 가능하게 (웹 주소로 열었을 때만 동작)
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
